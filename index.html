<!DOCTYPE html>
<html lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>체위 룰렛 🎲</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col items-center justify-between p-4 select-none pb-8 text-white">

  <!-- 헤더 영역 -->
  <header class="w-full max-w-sm text-center pt-3">
    <div class="inline-block bg-rose-950 text-rose-300 text-xs font-bold px-3 py-1 rounded-full mb-1 border border-rose-800">
      🎲 포지션 룰렛
    </div>
    <h1 class="text-2xl font-black text-rose-100">체위 룰렛</h1>
    <p class="text-xs text-slate-400 mt-1">버튼을 눌러 무작위로 선택합니다.</p>
  </header>

  <!-- 룰렛 본체 영역 -->
  <main class="w-full max-w-sm flex flex-col items-center my-auto">
    <div class="relative w-full aspect-square max-w-[320px] flex items-center justify-center p-2">
      <!-- 상단 지침 핀 -->
      <div class="absolute -top-1 left-1/2 -translate-x-1/2 z-20 flex flex-col items-center">
        <div class="w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-t-[24px] border-t-rose-500 drop-shadow-md"></div>
        <div class="w-3 h-3 bg-rose-600 rounded-full -mt-6"></div>
      </div>

      <!-- 룰렛 캔버스 -->
      <canvas id="rouletteCanvas" class="w-full h-full drop-shadow-2xl rounded-full"></canvas>

      <!-- 중앙 원판 -->
      <div class="absolute w-14 h-14 bg-slate-800 rounded-full shadow-lg border-4 border-rose-500 flex items-center justify-center z-10">
        <span class="text-xl">🎲</span>
      </div>
    </div>

    <!-- 실행 버튼 -->
    <button id="spinBtn" onclick="spinRoulette()" class="w-full mt-6 py-4 bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 text-white font-black text-lg rounded-2xl shadow-xl flex items-center justify-center gap-2 border border-rose-400/30 active:scale-95 transition">
      <i class="fa-solid fa-arrows-rotate text-xl"></i>
      <span>룰렛 돌리기</span>
    </button>
  </main>

  <!-- 목록 관리 영역 -->
  <section class="w-full max-w-sm bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-sm mt-3">
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-xs font-black text-slate-300">항목 목록 (<span id="menuCount">8</span>개)</h2>
      <button onclick="resetDefaultMenu()" class="text-[11px] text-slate-400 hover:text-slate-200 underline">기본값 복원</button>
    </div>

    <!-- 추가 입력창 -->
    <div class="flex gap-2 mb-2.5">
      <input id="newMenuInput" type="text" placeholder="새 항목 입력" maxlength="10" 
             class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs font-bold text-white outline-none focus:border-rose-500">
      <button onclick="addMenu()" class="bg-rose-600 hover:bg-rose-500 text-white font-bold px-3 py-2 rounded-xl text-xs active:scale-95 transition">
        추가
      </button>
    </div>

    <!-- 태그 목록 -->
    <div id="tagContainer" class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto pr-1"></div>
  </section>

  <!-- 결과 모달 -->
  <div id="resultModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 rounded-3xl p-6 text-center max-w-xs w-full shadow-2xl border-4 border-rose-500">
      <div class="text-5xl mb-2">✨</div>
      <p class="text-xs text-rose-400 font-extrabold tracking-wider">선택된 항목</p>
      <h3 id="resultMenuText" class="text-2xl font-black text-white my-2">정상위</h3>
      <p id="resultDescText" class="text-xs text-slate-300 mb-5 leading-relaxed">기본적인 대면 체위</p>

      <button onclick="closeModal()" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-xl shadow-md text-xs transition active:scale-95">
        확인
      </button>
    </div>
  </div>

  <script>
    // 오디오 합성
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTick() {
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.05);
      } catch(e) {}
    }

    function playWinSound() {
      try {
        const ctx = getAudioCtx();
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const start = ctx.currentTime + (idx * 0.08);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0, start);
          gain.gain.linearRampToValueAtTime(0.3, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.01, start + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.26);
        });
      } catch(e) {}
    }

    // 8가지 기본 항목 및 설명
    const defaultData = [
      { name: '정상위', desc: '서로 마주 보는 기본적인 대면 체위' },
      { name: '후배위', desc: '뒤에서 결합하는 형태의 체위' },
      { name: '여성상위', desc: '여성이 위에 위치하여 주도하는 체위' },
      { name: '측와위', desc: '서로 옆으로 누운 상태에서 진행하는 체위' },
      { name: '기승위 (역)', desc: '여성이 뒤를 돌아보고 앉는 체위' },
      { name: '좌위', desc: '서로 앉은 자세로 마주 보는 체위' },
      { name: '입위', desc: '서 있는 자세로 진행하는 체위' },
      { name: '스푼위', desc: '같은 방향으로 누워 밀착하는 체위' }
    ];

    const sliceColors = [
      '#E11D48', '#BE185D', '#9D174D', '#831843', 
      '#4C0519', '#9F1239', '#C026D3', '#7C3AED'
    ];

    let items = JSON.parse(localStorage.getItem('my_position_roulette')) || [...defaultData];

    const canvas = document.getElementById('rouletteCanvas');
    const ctx = canvas.getContext('2d');
    let currentAngle = 0;
    let isSpinning = false;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      drawRoulette();
    }

    function drawRoulette() {
      const rect = canvas.getBoundingClientRect();
      const count = items.length;
      const arc = (2 * Math.PI) / count;
      const radius = rect.width / 2;
      const cx = radius;
      const cy = radius;

      ctx.clearRect(0, 0, rect.width, rect.height);

      for (let i = 0; i < count; i++) {
        const start = currentAngle + i * arc;
        const end = start + arc;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius - 4, start, end);
        ctx.fillStyle = sliceColors[i % sliceColors.length];
        ctx.fill();
        ctx.strokeStyle = '#1E293B';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(start + arc / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 13px Noto Sans KR';
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 3;
        ctx.fillText(items[i].name, radius - 20, 5);
        ctx.restore();
      }
    }

    function spinRoulette() {
      if (isSpinning) return;
      if (items.length < 2) {
        alert('최소 2개 이상의 항목이 필요합니다.');
        return;
      }

      isSpinning = true;
      document.getElementById('spinBtn').classList.add('opacity-50', 'pointer-events-none');

      const fullSpins = 5 + Math.floor(Math.random() * 4);
      const extraAngle = Math.random() * Math.PI * 2;
      const totalRotation = fullSpins * Math.PI * 2 + extraAngle;

      const duration = 3500;
      const startTime = performance.now();
      const startAngle = currentAngle;
      let lastTickAngle = currentAngle;

      function animate(time) {
        const elapsed = time - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 3);
        currentAngle = startAngle + totalRotation * ease;

        const arc = (Math.PI * 2) / items.length;
        if (Math.abs(currentAngle - lastTickAngle) >= arc) {
          playTick();
          lastTickAngle = currentAngle;
        }

        drawRoulette();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          document.getElementById('spinBtn').classList.remove('opacity-50', 'pointer-events-none');
          selectWinner();
        }
      }

      requestAnimationFrame(animate);
    }

    function selectWinner() {
      const arc = (Math.PI * 2) / items.length;
      const topAngle = (3 * Math.PI) / 2;
      const normalized = (topAngle - (currentAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      const winningIndex = Math.floor(normalized / arc) % items.length;
      const winner = items[winningIndex];

      playWinSound();
      showResult(winner);
    }

    function showResult(item) {
      document.getElementById('resultMenuText').textContent = item.name;
      document.getElementById('resultDescText').textContent = item.desc || '선택된 항목입니다.';
      document.getElementById('resultModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('resultModal').classList.add('hidden');
    }

    function updateMenuTags() {
      const container = document.getElementById('tagContainer');
      container.innerHTML = '';
      items.forEach((item, idx) => {
        const tag = document.createElement('div');
        tag.className = 'flex items-center gap-1.5 bg-slate-700 text-slate-200 border border-slate-600 text-xs font-bold px-2.5 py-1 rounded-xl';
        tag.innerHTML = `
          <span>${item.name}</span>
          <button onclick="removeMenu(${idx})" class="text-slate-400 hover:text-red-400 text-xs">✕</button>
        `;
        container.appendChild(tag);
      });
      document.getElementById('menuCount').textContent = items.length;
      localStorage.setItem('my_position_roulette', JSON.stringify(items));
      drawRoulette();
    }

    function addMenu() {
      const input = document.getElementById('newMenuInput');
      const val = input.value.trim();
      if (!val) return;
      if (items.some(i => i.name === val)) {
        alert('이미 존재하는 항목입니다.');
        return;
      }
      items.push({ name: val, desc: '' });
      input.value = '';
      updateMenuTags();
    }

    function removeMenu(idx) {
      if (items.length <= 2) {
        alert('최소 2개 이상의 항목이 있어야 합니다.');
        return;
      }
      items.splice(idx, 1);
      updateMenuTags();
    }

    function resetDefaultMenu() {
      if (confirm('기본 목록으로 복원하시겠습니까?')) {
        items = [...defaultData];
        updateMenuTags();
      }
    }

    document.getElementById('newMenuInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addMenu();
    });

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', () => {
      resizeCanvas();
      updateMenuTags();
    });
    setTimeout(resizeCanvas, 100);
  </script>
</body>
</html>
