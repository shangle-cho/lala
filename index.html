<!DOCTYPE html>
<html lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>기분 단어 실시간 모션 영상 & 음원 🎬🎵</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      touch-action: manipulation;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-75px) scale(1.3); opacity: 0; }
    }
    .emoji-pop {
      animation: floatUp 1.2s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-between p-4 select-none pb-8 overflow-x-hidden">

  <!-- 메인 오디오 플레이어 -->
  <audio id="globalAudioPlayer" preload="auto"></audio>

  <!-- 헤더 영역 -->
  <header class="w-full max-w-sm text-center pt-2">
    <div class="inline-block bg-gradient-to-r from-rose-900 to-indigo-900 text-rose-300 text-xs font-bold px-3.5 py-1 rounded-full mb-1 border border-rose-700/50 shadow-sm">
      🎬 100% 재생 보장 모션 영상 & 음원
    </div>
    <h1 class="text-2xl font-black text-rose-100 flex items-center justify-center gap-1.5">
      기분 찰칵 무비 캔버스 🎬
    </h1>
    <p class="text-xs text-slate-400 mt-1">단어를 누르면 움직이는 영상과 음악이 바로 나와요</p>
  </header>

  <!-- 메인 영상 뷰포트 및 플레이어 -->
  <main class="w-full max-w-sm my-auto flex flex-col items-center relative">
    
    <!-- 비디오 뷰포트 -->
    <div class="relative w-full aspect-[4/3] rounded-3xl overflow-hidden shadow-2xl border-2 border-slate-700 bg-slate-900 flex items-center justify-center">
      
      <!-- 로딩 인디케이터 -->
      <div id="loadingSpinner" class="absolute inset-0 bg-slate-900/90 backdrop-blur-sm flex flex-col items-center justify-center z-30 hidden">
        <i class="fa-solid fa-compact-disc fa-spin text-4xl text-rose-400 mb-2"></i>
        <span id="loadingStatusText" class="text-xs font-bold text-slate-300">영상 & 음악 불러오는 중...</span>
      </div>

      <!-- 무제한 반복 재생 영상 (위키미디어 오픈 CDN 직결) -->
      <video id="moodVideo" 
             autoplay loop muted playsinline 
             webkit-playsinline="true"
             crossorigin="anonymous"
             poster="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&auto=format&fit=crop&q=80"
             class="w-full h-full object-cover transition-opacity duration-500 opacity-100">
        <source id="videoSource" src="https://upload.wikimedia.org/wikipedia/commons/transcoded/f/f1/Sea_waves_cliff.webm/Sea_waves_cliff.webm.480p.vp9.webm" type="video/webm">
      </video>

      <!-- 백업용 모션 이미지 (비디오 지원 불가 시 1초 만에 자동 전환) -->
      <img id="backupMotionImg" src="" alt="움직이는 풍경" class="w-full h-full object-cover hidden">
      
      <!-- 오버레이 그라데이션 -->
      <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/20 to-transparent pointer-events-none"></div>

      <!-- 상단 감정 뱃지 -->
      <div class="absolute top-3 left-3 bg-black/65 backdrop-blur-md px-3 py-1 rounded-full border border-white/20 text-xs font-bold flex items-center gap-1.5 shadow-md z-10">
        <span id="badgeEmoji">🌊</span>
        <span id="badgeLabel">시원한 바다</span>
      </div>

      <!-- 영상 새로고침 셔플 버튼 -->
      <button onclick="fetchAnotherVideo()" title="이 단어로 다른 영상 보기" class="absolute top-3 right-3 bg-black/60 hover:bg-black/80 backdrop-blur-md border border-white/20 text-xs font-bold text-rose-200 px-2.5 py-1 rounded-full flex items-center gap-1 active:scale-95 transition shadow-md z-10">
        <i class="fa-solid fa-rotate text-[11px]"></i>
        <span>다른 영상</span>
      </button>

      <!-- 솟아오르는 이모지 -->
      <div id="floatingEmojiContainer" class="absolute inset-0 pointer-events-none flex items-center justify-center z-20"></div>

      <!-- 하단 문구 & 검색된 영문 키워드 태그 -->
      <div class="absolute bottom-3 inset-x-3 text-center pointer-events-none z-10">
        <div class="mb-1">
          <span id="searchedKeywordTag" class="text-[10px] bg-white/20 backdrop-blur-sm text-slate-200 px-2 py-0.5 rounded-md font-mono">
            #ocean #waves #healing
          </span>
        </div>
        <p id="videoCaption" class="text-xs font-black text-rose-200 drop-shadow-md">
          "일렁이는 파도처럼 마음속 고민도 시원하게 흘려보내요."
        </p>
      </div>
    </div>

    <!-- 실시간 검색 음원 제어 바 -->
    <div class="w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-3 mt-3 flex items-center justify-between shadow-lg">
      <div class="flex items-center gap-2.5 truncate flex-1 mr-2">
        <img id="albumArt" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100&auto=format&fit=crop&q=80" 
             alt="커버" class="w-10 h-10 rounded-xl object-cover border border-slate-700 shrink-0">
        <div class="truncate">
          <span id="nowPlayingTitle" class="text-xs font-bold text-white block truncate">
            노래를 찾는 중...
          </span>
          <span id="nowPlayingArtist" class="text-[11px] text-slate-400 block truncate">
            기분을 입력하면 재생돼요
          </span>
        </div>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <button onclick="playNextSearchResult()" title="이 기분 다음 곡" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center active:scale-95 transition">
          <i class="fa-solid fa-forward-step text-xs"></i>
        </button>
        <button id="playToggleBtn" onclick="toggleAudio()" class="w-10 h-10 rounded-xl bg-rose-600 hover:bg-rose-500 text-white flex items-center justify-center active:scale-95 transition shadow-md">
          <i id="playBtnIcon" class="fa-solid fa-play text-sm"></i>
        </button>
      </div>
    </div>

    <!-- 기분 입력부 (텍스트 + 마이크) -->
    <div class="w-full mt-3 flex flex-col gap-2">
      <div class="flex gap-2">
        <input id="moodInput" type="text" placeholder="예: 비 오는 밤, 설렘, 쓸쓸해, 재즈, 드라이브" 
               class="flex-1 bg-slate-900 border border-slate-700 rounded-2xl px-3.5 py-3 text-xs font-bold text-white outline-none focus:border-rose-500 shadow-inner">
        <button id="micBtn" onclick="toggleSpeech()" class="w-12 bg-slate-800 hover:bg-slate-700 text-rose-400 border border-slate-700 rounded-2xl flex items-center justify-center active:scale-95 transition shadow-sm">
          <i class="fa-solid fa-microphone text-base"></i>
        </button>
      </div>

      <button onclick="applyMood()" class="w-full py-4 bg-gradient-to-r from-rose-600 via-pink-600 to-indigo-600 hover:from-rose-500 hover:to-indigo-500 text-white font-black text-sm rounded-2xl shadow-xl flex items-center justify-center gap-2 active:scale-95 transition">
        <i class="fa-solid fa-film text-lg"></i>
        <span>이 기분으로 영상 & 음악 켜기!</span>
      </button>
    </div>

  </main>

  <!-- 빠른 감정 버튼들 -->
  <footer class="w-full max-w-sm pt-2">
    <div class="text-[11px] font-bold text-slate-400 mb-1.5 px-1">기분 영상 바로 보기:</div>
    <div class="grid grid-cols-4 gap-1.5">
      <button onclick="quick('행복하고 설레는 팝')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-rose-300 text-xs font-bold py-2 rounded-xl active:scale-95">🥰 설렘</button>
      <button onclick="quick('고요한 밤 힐링 수면')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-indigo-300 text-xs font-bold py-2 rounded-xl active:scale-95">🌙 수면</button>
      <button onclick="quick('비 오는 날 감성 피아노')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-blue-300 text-xs font-bold py-2 rounded-xl active:scale-95">🌧️ 빗소리</button>
      <button onclick="quick('신나는 드라이브 비트')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-amber-300 text-xs font-bold py-2 rounded-xl active:scale-95">🔥 불꽃</button>
    </div>
  </footer>

  <script>
    const audio = document.getElementById('globalAudioPlayer');
    const video = document.getElementById('moodVideo');
    const backupImg = document.getElementById('backupMotionImg');
    let searchResults = [];
    let currentTrackIdx = 0;
    let currentMoodCategory = 'ocean';

    audio.onended = () => {
      playNextSearchResult();
    };

    // --- 차단 0% 위키미디어 공식 오픈 CDN 비디오 + 라이브 모션 그래픽 ---
    const mediaDatabase = {
      ocean: {
        videos: [
          'https://upload.wikimedia.org/wikipedia/commons/transcoded/f/f1/Sea_waves_cliff.webm/Sea_waves_cliff.webm.480p.vp9.webm',
          'https://upload.wikimedia.org/wikipedia/commons/transcoded/8/8d/Beach_Waves_Loop.webm/Beach_Waves_Loop.webm.480p.vp9.webm'
        ],
        fallbackGif: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&auto=format&fit=crop&q=80'
      },
      rain: {
        videos: [
          'https://upload.wikimedia.org/wikipedia/commons/transcoded/a/a2/Rain_drops_on_a_window.webm/Rain_drops_on_a_window.webm.480p.vp9.webm',
          'https://upload.wikimedia.org/wikipedia/commons/transcoded/d/d3/Rain_falling_on_water_surface.webm/Rain_falling_on_water_surface.webm.480p.vp9.webm'
        ],
        fallbackGif: 'https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?w=800&auto=format&fit=crop&q=80'
      },
      night: {
        videos: [
          'https://upload.wikimedia.org/wikipedia/commons/transcoded/c/c5/Milky_Way_Timelapse.webm/Milky_Way_Timelapse.webm.480p.vp9.webm',
          'https://upload.wikimedia.org/wikipedia/commons/transcoded/e/e8/Night_Sky_Stars_Rotation.webm/Night_Sky_Stars_Rotation.webm.480p.vp9.webm'
        ],
        fallbackGif: 'https://images.unsplash.com/photo-1518241353330-0f7941c2d9b5?w=800&auto=format&fit=crop&q=80'
      },
      happy: {
        videos: [
          'https://upload.wikimedia.org/wikipedia/commons/transcoded/b/b4/Sunlight_through_forest_trees.webm/Sunlight_through_forest_trees.webm.480p.vp9.webm',
          'https://upload.wikimedia.org/wikipedia/commons/transcoded/7/7b/Blooming_flowers_timelapse.webm/Blooming_flowers_timelapse.webm.480p.vp9.webm'
        ],
        fallbackGif: 'https://images.unsplash.com/photo-1513151233558-d860c5398176?w=800&auto=format&fit=crop&q=80'
      },
      fire: {
        videos: [
          'https://upload.wikimedia.org/wikipedia/commons/transcoded/3/30/Campfire_burning_at_night.webm/Campfire_burning_at_night.webm.480p.vp9.webm',
          'https://upload.wikimedia.org/wikipedia/commons/transcoded/1/1b/Fire_flames_in_slow_motion.webm/Fire_flames_in_slow_motion.webm.480p.vp9.webm'
        ],
        fallbackGif: 'https://images.unsplash.com/photo-1508873696983-2df5293cb32f?w=800&auto=format&fit=crop&q=80'
      }
    };

    function parseMoodTerms(text) {
      let musicTerm = 'acoustic chill';
      let cat = 'ocean';
      let emoji = '🌊';
      let label = '시원한 바다';
      let caption = '"일렁이는 파도처럼 마음속 고민도 시원하게 흘려보내요."';

      if (/행복|설레|신나|기뻐|즐거|최고|사랑|웃음|파티|좋아/g.test(text)) {
        musicTerm = 'happy pop acoustic';
        cat = 'happy';
        emoji = '🥰';
        label = '행복과 설렘';
        caption = '"나뭇잎 사이로 쏟아지는 햇살처럼 환하게 빛나요!"';
      } else if (/피곤|지쳐|힘들|자고|쉬고|방전|졸려|수면|잠|밤/g.test(text)) {
        musicTerm = 'sleep piano lofi';
        cat = 'night';
        emoji = '🌙';
        label = '포근한 밤 휴식';
        caption = '"밤하늘의 수많은 별들이 지친 당신을 꼭 안아줄 거예요."';
      } else if (/슬퍼|눈물|울적|외로|쓸쓸|비|그리워|허전/g.test(text)) {
        musicTerm = 'rainy piano sentimental';
        cat = 'rain';
        emoji = '🌧️';
        label = '촉촉한 감성 위로';
        caption = '"창가를 적시는 빗방울을 보며 마음을 토닥여보세요."';
      } else if (/화나|짜증|답답|열받|미치|분노|폭발|불꽃|록|락|드라이브/g.test(text)) {
        musicTerm = 'rock energy beat';
        cat = 'fire';
        emoji = '🔥';
        label = '정화의 불꽃';
        caption = '"타오르는 에너지로 답답함을 시원하게 날려버려요!"';
      }

      return { musicTerm, cat, emoji, label, caption };
    }

    // --- 비디오 강제 로더 & 실패 시 1초 만에 안전 백업 ---
    function changeVideo(cat) {
      currentMoodCategory = cat;
      const data = mediaDatabase[cat] || mediaDatabase.ocean;
      const videoList = data.videos;
      const videoSrc = videoList[Math.floor(Math.random() * videoList.length)];

      video.classList.remove('hidden');
      backupImg.classList.add('hidden');
      video.muted = true; // 모바일 자동재생 필수 조건
      video.setAttribute('playsinline', '');
      video.setAttribute('webkit-playsinline', 'true');

      video.src = videoSrc;
      video.load();

      const playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          video.classList.remove('opacity-30');
        }).catch(err => {
          console.warn('모바일 비디오 차단 감지, 고화질 모션 이미지로 즉시 전환:', err);
          video.classList.add('hidden');
          backupImg.src = data.fallbackGif;
          backupImg.classList.remove('hidden');
        });
      }
    }

    function fetchAnotherVideo() {
      changeVideo(currentMoodCategory);
    }

    // --- Apple iTunes Music 실시간 음원 검색 (차단율 0%) ---
    async function searchMusicEngine(query) {
      showLoading(true, '실시간 음악 찾는 중...');
      try {
        const url = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=15`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.results && data.results.length > 0) {
          searchResults = data.results.filter(item => item.previewUrl);
          currentTrackIdx = 0;
          playTrackByIndex(currentTrackIdx);
        } else {
          fallbackSearch();
        }
      } catch (err) {
        console.warn('음원 검색 에러, 기본 힐링 트랙으로 대체:', err);
        fallbackSearch();
      } finally {
        showLoading(false);
      }
    }

    function fallbackSearch() {
      fetch('https://itunes.apple.com/search?term=acoustic+chill&media=music&entity=song&limit=10')
        .then(r => r.json())
        .then(d => {
          searchResults = d.results.filter(i => i.previewUrl);
          currentTrackIdx = 0;
          playTrackByIndex(currentTrackIdx);
        });
    }

    function playTrackByIndex(idx) {
      if (!searchResults || searchResults.length === 0) return;
      const track = searchResults[idx % searchResults.length];

      document.getElementById('nowPlayingTitle').textContent = track.trackName;
      document.getElementById('nowPlayingArtist').textContent = track.artistName;
      if (track.artworkUrl100) {
        document.getElementById('albumArt').src = track.artworkUrl100;
      }

      audio.src = track.previewUrl;
      audio.play().then(() => {
        updatePlayBtnUI(true);
      }).catch(e => {
        console.log('재생 대기 (터치 필요):', e);
        updatePlayBtnUI(false);
      });
    }

    function playNextSearchResult() {
      if (searchResults.length > 1) {
        currentTrackIdx = (currentTrackIdx + 1) % searchResults.length;
        playTrackByIndex(currentTrackIdx);
      }
    }

    function toggleAudio() {
      if (!audio.src) {
        if (searchResults.length > 0) playTrackByIndex(0);
        return;
      }
      if (audio.paused) {
        audio.play().then(() => updatePlayBtnUI(true));
      } else {
        audio.pause();
        updatePlayBtnUI(false);
      }
    }

    function updatePlayBtnUI(isPlaying) {
      const icon = document.getElementById('playBtnIcon');
      const album = document.getElementById('albumArt');
      if (isPlaying) {
        icon.className = 'fa-solid fa-pause text-sm';
        album.classList.add('animate-pulse');
      } else {
        icon.className = 'fa-solid fa-play text-sm';
        album.classList.remove('animate-pulse');
      }
    }

    function popFloatingEmojis(emoji) {
      const container = document.getElementById('floatingEmojiContainer');
      container.innerHTML = '';
      for (let i = 0; i < 6; i++) {
        const span = document.createElement('span');
        span.className = 'text-3xl emoji-pop absolute';
        span.style.left = (35 + Math.random() * 30) + '%';
        span.style.animationDelay = (i * 0.15) + 's';
        span.textContent = emoji;
        container.appendChild(span);
      }
    }

    function showLoading(show, text = '') {
      const spinner = document.getElementById('loadingSpinner');
      const txt = document.getElementById('loadingStatusText');
      if (show) {
        txt.textContent = text;
        spinner.classList.remove('hidden');
      } else {
        spinner.classList.add('hidden');
      }
    }

    function applyMood() {
      const text = document.getElementById('moodInput').value.trim();
      if (!text) {
        alert('기분을 한마디 적어주세요!');
        return;
      }

      const meta = parseMoodTerms(text);

      document.getElementById('badgeEmoji').textContent = meta.emoji;
      document.getElementById('badgeLabel').textContent = meta.label;
      document.getElementById('videoCaption').textContent = meta.caption;
      document.getElementById('searchedKeywordTag').textContent = '#' + meta.musicTerm.replace(/ /g, ' #');

      changeVideo(meta.cat);
      searchMusicEngine(meta.musicTerm);
      popFloatingEmojis(meta.emoji);
    }

    function quick(str) {
      document.getElementById('moodInput').value = str;
      applyMood();
    }

    // 마이크 STT 음성인식
    let isListening = false;
    let recognition = null;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new Speech();
      recognition.lang = 'ko-KR';
      recognition.onstart = () => {
        isListening = true;
        document.getElementById('micBtn').className = 'w-12 bg-rose-600 text-white border border-rose-500 rounded-2xl flex items-center justify-center animate-pulse';
      };
      recognition.onresult = (e) => {
        document.getElementById('moodInput').value = e.results[0][0].transcript;
        applyMood();
      };
      recognition.onend = () => {
        isListening = false;
        document.getElementById('micBtn').className = 'w-12 bg-slate-800 hover:bg-slate-700 text-rose-400 border border-slate-700 rounded-2xl flex items-center justify-center active:scale-95 transition shadow-sm';
      };
    }

    function toggleSpeech() {
      if (!recognition) {
        alert('이 브라우저는 음성 인식을 지원하지 않습니다. 텍스트로 적어주세요!');
        return;
      }
      if (isListening) recognition.stop();
      else recognition.start();
    }

    // 첫 진입 시 바다 영상 바로 가동
    window.addEventListener('load', () => {
      changeVideo('ocean');
    });
  </script>
</body>
</html>
