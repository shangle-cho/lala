<!DOCTYPE html>
<html lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>기분 찰칵 & 뮤직 라운지 📸🎵</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      touch-action: manipulation;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-70px) scale(1.3); opacity: 0; }
    }
    .emoji-pop {
      animation: floatUp 1.2s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-between p-4 select-none pb-8 overflow-x-hidden">

  <!-- 헤더 영역 -->
  <header class="w-full max-w-sm text-center pt-2">
    <div class="inline-block bg-gradient-to-r from-rose-900 to-indigo-900 text-rose-300 text-xs font-bold px-3.5 py-1 rounded-full mb-1 border border-rose-700/50 shadow-sm">
      📸 실시간 포토 & 감정 사운드트랙
    </div>
    <h1 class="text-2xl font-black text-rose-100 flex items-center justify-center gap-1.5">
      기분 찰칵 뮤직 캔버스 🎵
    </h1>
    <p class="text-xs text-slate-400 mt-1">지금 기분을 말하면 사진과 음악이 흘러나와요</p>
  </header>

  <!-- 메인 사진 액자 & 음악 컨트롤러 -->
  <main class="w-full max-w-sm my-auto flex flex-col items-center relative">
    
    <!-- 사진 뷰포트 -->
    <div class="relative w-full aspect-[4/3] rounded-3xl overflow-hidden shadow-2xl border-2 border-slate-700 bg-slate-900 flex items-center justify-center group">
      <!-- 배경 사진 -->
      <img id="moodPhoto" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&auto=format&fit=crop&q=80" 
           alt="기분 사진" class="w-full h-full object-cover transition-transform duration-700">
      
      <!-- 오버레이 그라데이션 -->
      <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>

      <!-- 상단 감정 뱃지 -->
      <div class="absolute top-3 left-3 bg-black/60 backdrop-blur-md px-3 py-1 rounded-full border border-white/20 text-xs font-bold flex items-center gap-1.5 shadow-md">
        <span id="badgeEmoji">🏖️</span>
        <span id="badgeLabel">평화로운 바다</span>
      </div>

      <!-- 음악 재생 중 표시등 (우측 상단) -->
      <div id="musicIndicator" class="absolute top-3 right-3 bg-emerald-950/80 border border-emerald-500/60 px-2.5 py-1 rounded-full text-[10px] font-bold text-emerald-300 flex items-center gap-1.5 shadow-md">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
        <span id="musicStateText">BGM 연주 중</span>
      </div>

      <!-- 사진 위로 솟아오르는 이모지 컨테이너 -->
      <div id="floatingEmojiContainer" class="absolute inset-0 pointer-events-none flex items-center justify-center"></div>

      <!-- 하단 문구 -->
      <div class="absolute bottom-3 inset-x-3 text-center">
        <p id="photoCaption" class="text-xs font-black text-rose-200 drop-shadow-md">
          "지금 이 순간, 당신의 마음에 꼭 맞는 풍경을 담았어요."
        </p>
      </div>
    </div>

    <!-- 오디오 제어 버튼 바 -->
    <div class="w-full flex items-center justify-between mt-2.5 px-2">
      <span id="nowPlayingTrack" class="text-xs text-indigo-300 font-bold truncate max-w-[200px]">
        🎵 평온의 멜로디
      </span>
      <button onclick="toggleBgm()" class="text-xs bg-slate-900 border border-slate-700 hover:bg-slate-800 text-slate-300 px-3 py-1 rounded-xl active:scale-95 transition flex items-center gap-1.5">
        <i id="bgmIcon" class="fa-solid fa-volume-high text-indigo-400"></i>
        <span id="bgmBtnText">음악 끄기</span>
      </button>
    </div>

    <!-- 입력부 (텍스트 + 음성인식 마이크) -->
    <div class="w-full mt-3 flex flex-col gap-2">
      <div class="flex gap-2">
        <input id="moodInput" type="text" placeholder="예: 오늘따라 신나고 설레! or 너무 피곤해" 
               class="flex-1 bg-slate-900 border border-slate-700 rounded-2xl px-3.5 py-3 text-xs font-bold text-white outline-none focus:border-rose-500 shadow-inner">
        <button id="micBtn" onclick="toggleSpeech()" class="w-12 bg-slate-800 hover:bg-slate-700 text-rose-400 border border-slate-700 rounded-2xl flex items-center justify-center active:scale-95 transition shadow-sm">
          <i class="fa-solid fa-microphone text-base"></i>
        </button>
      </div>

      <button onclick="applyMood()" class="w-full py-4 bg-gradient-to-r from-rose-600 via-pink-600 to-indigo-600 hover:from-rose-500 hover:to-indigo-500 text-white font-black text-sm rounded-2xl shadow-xl flex items-center justify-center gap-2 active:scale-95 transition">
        <i class="fa-solid fa-camera-retro text-lg"></i>
        <span>사진 & 음악 매칭하기!</span>
      </button>
    </div>

  </main>

  <!-- 빠른 감정 버튼들 -->
  <footer class="w-full max-w-sm pt-2">
    <div class="text-[11px] font-bold text-slate-400 mb-1.5 px-1">기분 바로 고르기:</div>
    <div class="grid grid-cols-4 gap-1.5">
      <button onclick="quick('행복하고 설레')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-rose-300 text-xs font-bold py-2 rounded-xl active:scale-95">🥰 설렘</button>
      <button onclick="quick('피곤하고 지쳐')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-indigo-300 text-xs font-bold py-2 rounded-xl active:scale-95">🥱 지침</button>
      <button onclick="quick('비 오고 쓸쓸해')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-blue-300 text-xs font-bold py-2 rounded-xl active:scale-95">🌧️ 쓸쓸</button>
      <button onclick="quick('화나고 짜증나')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-amber-300 text-xs font-bold py-2 rounded-xl active:scale-95">🔥 폭발</button>
    </div>
