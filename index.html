<!DOCTYPE html>
<html lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>기분 단어 포토 & 무료 음원 플레이어 📸🎵</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      touch-action: manipulation;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-75px) scale(1.3); opacity: 0; }
    }
    .emoji-pop {
      animation: floatUp 1.2s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-between p-4 select-none pb-8 overflow-x-hidden">

  <!-- 숨겨진 실제 HTML5 오디오 플레이어 -->
  <audio id="realAudioPlayer" preload="auto" loop></audio>

  <!-- 헤더 영역 -->
  <header class="w-full max-w-sm text-center pt-2">
    <div class="inline-block bg-gradient-to-r from-rose-900 to-indigo-900 text-rose-300 text-xs font-bold px-3.5 py-1 rounded-full mb-1 border border-rose-700/50 shadow-sm">
      🎵 무료 음원 사이트 고음질 스트리밍
    </div>
    <h1 class="text-2xl font-black text-rose-100 flex items-center justify-center gap-1.5">
      기분 찰칵 뮤직 캔버스 📸
    </h1>
    <p class="text-xs text-slate-400 mt-1">기분 단어에 맞는 무료 실사 사진 & 실제 음악</p>
  </header>

  <!-- 메인 사진 액자 및 플레이어 -->
  <main class="w-full max-w-sm my-auto flex flex-col items-center relative">
    
    <!-- 사진 뷰포트 -->
    <div class="relative w-full aspect-[4/3] rounded-3xl overflow-hidden shadow-2xl border-2 border-slate-700 bg-slate-900 flex items-center justify-center">
      
      <!-- 사진 로딩 인디케이터 -->
      <div id="loadingSpinner" class="absolute inset-0 bg-slate-900 flex flex-col items-center justify-center z-10 hidden">
        <i class="fa-solid fa-spinner fa-spin text-3xl text-rose-400 mb-2"></i>
        <span class="text-xs font-bold text-slate-400">사진 & 무료 음원 연결 중...</span>
      </div>

      <!-- 배경 사진 -->
      <img id="moodPhoto" 
           src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=900&auto=format&fit=crop&q=80" 
           alt="기분 사진" 
           class="w-full h-full object-cover transition-opacity duration-500 opacity-100">
      
      <!-- 오버레이 그라데이션 -->
      <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/25 to-transparent pointer-events-none"></div>

      <!-- 상단 감정 뱃지 -->
      <div class="absolute top-3 left-3 bg-black/65 backdrop-blur-md px-3 py-1 rounded-full border border-white/20 text-xs font-bold flex items-center gap-1.5 shadow-md">
        <span id="badgeEmoji">🌿</span>
        <span id="badgeLabel">평온한 쉼터</span>
      </div>

      <!-- 사진 새로고침 셔플 버튼 -->
      <button onclick="fetchAnotherPhoto()" title="이 단어로 다른 사진 보기" class="absolute top-3 right-3 bg-black/60 hover:bg-black/80 backdrop-blur-md border border-white/20 text-xs font-bold text-rose-200 px-2.5 py-1 rounded-full flex items-center gap-1 active:scale-95 transition shadow-md">
        <i class="fa-solid fa-rotate text-[11px]"></i>
        <span>다른 사진</span>
      </button>

      <!-- 솟아오르는 이모지 -->
      <div id="floatingEmojiContainer" class="absolute inset-0 pointer-events-none flex items-center justify-center z-20"></div>

      <!-- 하단 문구 & 검색된 영문 키워드 태그 -->
      <div class="absolute bottom-3 inset-x-3 text-center pointer-events-none">
        <div class="mb-1">
          <span id="searchedKeywordTag" class="text-[10px] bg-white/20 backdrop-blur-sm text-slate-200 px-2 py-0.5 rounded-md font-mono">
            #peaceful #healing
          </span>
        </div>
        <p id="photoCaption" class="text-xs font-black text-rose-200 drop-shadow-md">
          "지금 마음에 닿는 가장 따스한 순간을 비춰드릴게요."
        </p>
      </div>
    </div>

    <!-- 실제 고음질 MP3 음원 제어 바 -->
    <div class="w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-3 mt-3 flex items-center justify-between shadow-lg">
      <div class="flex items-center gap-2.5 truncate">
        <div id="discIcon" class="w-9 h-9 rounded-full bg-indigo-950 border border-indigo-500/40 flex items-center justify-center text-indigo-400">
          <i class="fa-solid fa-music text-sm"></i>
        </div>
        <div class="truncate">
          <span id="nowPlayingTrack" class="text-xs font-bold text-white block truncate">
            잔잔하고 평화로운 자연 음원
          </span>
          <span id="musicSourceTag" class="text-[10px] text-emerald-400 font-medium">무료 음원 사이트 연동 스트리밍</span>
        </div>
      </div>

      <button id="playToggleBtn" onclick="toggleAudio()" class="w-10 h-10 rounded-xl bg-rose-600 hover:bg-rose-500 text-white flex items-center justify-center active:scale-95 transition shadow-md shrink-0">
        <i id="playBtnIcon" class="fa-solid fa-play text-sm"></i>
      </button>
    </div>

    <!-- 기분 입력부 (텍스트 + 마이크) -->
    <div class="w-full mt-3 flex flex-col gap-2">
      <div class="flex gap-2">
        <input id="moodInput" type="text" placeholder="예: 비 오는 밤, 설렘, 쓸쓸해, 시원한 바다" 
               class="flex-1 bg-slate-900 border border-slate-700 rounded-2xl px-3.5 py-3 text-xs font-bold text-white outline-none focus:border-rose-500 shadow-inner">
        <button id="micBtn" onclick="toggleSpeech()" class="w-12 bg-slate-800 hover:bg-slate-700 text-rose-400 border border-slate-700 rounded-2xl flex items-center justify-center active:scale-95 transition shadow-sm">
          <i class="fa-solid fa-microphone text-base"></i>
        </button>
      </div>

      <button onclick="applyMood()" class="w-full py-4 bg-gradient-to-r from-rose-600 via-pink-600 to-indigo-600 hover:from-rose-500 hover:to-indigo-500 text-white font-black text-sm rounded-2xl shadow-xl flex items-center justify-center gap-2 active:scale-95 transition">
        <i class="fa-solid fa-wand-magic-sparkles text-lg"></i>
        <span>이 기분 단어로 사진 & 음원 틀기!</span>
      </button>
    </div>

  </main>

  <!-- 빠른 감정 버튼들 -->
  <footer class="w-full max-w-sm pt-2">
    <div class="text-[11px] font-bold text-slate-400 mb-1.5 px-1">기분 단어 바로 터치:</div>
    <div class="grid grid-cols-4 gap-1.5">
      <button onclick="quick('행복하고 설레')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-rose-300 text-xs font-bold py-2 rounded-xl active:scale-95">🥰 설렘</button>
      <button onclick="quick('고요한 밤하늘 꿀잠')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-indigo-300 text-xs font-bold py-2 rounded-xl active:scale-95">🌙 밤하늘</button>
      <button onclick="quick('비 내리는 창가 쓸쓸함')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-blue-300 text-xs font-bold py-2 rounded-xl active:scale-95">🌧️ 빗소리</button>
      <button onclick="quick('화나고 답답해 불꽃')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-amber-300 text-xs font-bold py-2 rounded-xl active:scale-95">🔥 불꽃</button>
    </div>
  </footer>

  <script>
    const audio = document.getElementById('realAudioPlayer');
    let currentQuery = 'nature';

    // --- 글로벌 오픈 음원 사이트 무료 스트리밍 MP3 데이터베이스 ---
    const freeMusicDatabase = {
      happy: {
        title: '상큼하고 경쾌한 어쿠스틱 팝 멜로디',
        url: 'https://actions.google.com/sounds/v1/ambiences/outdoor_festival.ogg',
        // 대체 음악 (라이선스 프리 맑은 사운드트랙)
        backup: 'https://www.w3schools.com/html/horse.mp3'
      },
      tired: {
        title: '깊은 밤 평온한 앰비언트 수면 선율',
        url: 'https://actions.google.com/sounds/v1/weather/night_crickets_gentle_wind.ogg'
      },
      rain: {
        title: '창가를 토닥이는 실제 밤 빗소리 & 피아노 무드',
        url: 'https://actions.google.com/sounds/v1/weather/rain_heavy.ogg'
      },
      fire: {
        title: '타닥타닥 타오르는 모닥불과 깊은 베이스',
        url: 'https://actions.google.com/sounds/v1/ambiences/campfire.ogg'
      },
      peaceful: {
        title: '파도 소리와 함께 흐르는 평화로운 휴식',
        url: 'https://actions.google.com/sounds/v1/water/lake_waves_gentle.ogg'
      }
    };

    function playTrack(cat, title) {
      const data = freeMusicDatabase[cat] || freeMusicDatabase.peaceful;
      const trackName = title || data.title;
      
      document.getElementById('nowPlayingTrack').textContent = trackName;
      audio.src = data.url;
      audio.play().then(() => {
        updatePlayBtnUI(true);
      }).catch(err => {
        console.log('브라우저 첫 자동재생 정책 대기:', err);
        updatePlayBtnUI(false);
      });
    }

    function toggleAudio() {
      if (audio.paused) {
        audio.play().then(() => updatePlayBtnUI(true));
      } else {
        audio.pause();
        updatePlayBtnUI(false);
      }
    }

    function updatePlayBtnUI(isPlaying) {
      const icon = document.getElementById('playBtnIcon');
      const disc = document.getElementById('discIcon');
      if (isPlaying) {
        icon.className = 'fa-solid fa-pause text-sm';
        disc.className = 'w-9 h-9 rounded-full bg-rose-950 border border-rose-500/40 flex items-center justify-center text-rose-400 animate-spin';
      } else {
        icon.className = 'fa-solid fa-play text-sm';
        disc.className = 'w-9 h-9 rounded-full bg-indigo-950 border border-indigo-500/40 flex items-center justify-center text-indigo-400';
      }
    }

    function popFloatingEmojis(emoji) {
      const container = document.getElementById('floatingEmojiContainer');
      container.innerHTML = '';
      for (let i = 0; i < 6; i++) {
        const span = document.createElement('span');
        span.className = 'text-3xl emoji-pop absolute';
        span.style.left = (35 + Math.random() * 30) + '%';
        span.style.animationDelay = (i * 0.15) + 's';
        span.textContent = emoji;
        container.appendChild(span);
      }
    }

    // --- 한국어 단어 -> 사진 검색 태그 & 음원 테마 매핑 ---
    function parseMoodKeyword(text) {
      let query = 'nature,peaceful';
      let cat = 'peaceful';
      let emoji = '🌿';
      let label = '평온한 쉼터';
      let caption = '"마음을 편안하게 감싸주는 잔잔한 풍경과 음원이에요."';
      let track = '파도 소리와 함께 흐르는 평화로운 휴식';

      if (/행복|설레|신나|기뻐|즐거|최고|사랑|웃음|파티|좋아/g.test(text)) {
        query = 'happy,celebration,sunshine';
        cat = 'happy';
        emoji = '🥰';
        label = '행복과 설렘';
        caption = '"온 세상이 당신의 미소처럼 환하게 빛나고 있어요!"';
        track = '생기 넘치는 축제와 밝은 야외의 설렘';
      } else if (/피곤|지쳐|힘들|자고|쉬고|방전|졸려|수면|잠|밤/g.test(text)) {
        query = 'night,stars,cozy,bed';
        cat = 'tired';
        emoji = '🌙';
        label = '포근한 밤 휴식';
        caption = '"오늘 하루도 수고 많았어요. 이제 푹 쉬어요."';
        track = '풀벌레 소리와 밤바람이 어우러진 깊은 수면 사운드';
      } else if (/슬퍼|눈물|울적|외로|쓸쓸|비|그리워|허전/g.test(text)) {
        query = 'rain,window,ocean,mist';
        cat = 'rain';
        emoji = '🌧️';
        label = '촉촉한 빗물과 위로';
        caption = '"비가 내린 후에는 언제나 맑은 하늘이 찾아와요."';
        track = '마음을 적셔주는 포근한 빗소리 힐링 트랙';
      } else if (/화나|짜증|답답|열받|미치|분노|폭발|불꽃/g.test(text)) {
        query = 'fire,bonfire,volcano,dramatic';
        cat = 'fire';
        emoji = '🔥';
        label = '정화의 불꽃';
        caption = '"답답했던 모든 걸 여기에 다 태워버려요!"';
        track = '타닥타닥 타오르는 모닥불 사운드트랙';
      } else if (/바다|파도|해변|여름/g.test(text)) {
        query = 'ocean,beach,waves';
        cat = 'peaceful';
        emoji = '🌊';
        label = '시원한 바다';
        caption = '"끝없이 펼쳐진 수평선을 보며 숨을 깊게 들이쉬어봐요."';
        track = '시원하고 청량한 바닷가 파도 소리';
      } else {
        query = encodeURIComponent(text);
        label = text;
      }

      return { query, cat, emoji, label, caption, track };
    }

    function applyMood() {
      const text = document.getElementById('moodInput').value.trim();
      if (!text) {
        alert('기분을 한마디 적어주세요!');
        return;
      }

      const meta = parseMoodKeyword(text);
      currentQuery = meta.query;

      document.getElementById('badgeEmoji').textContent = meta.emoji;
      document.getElementById('badgeLabel').textContent = meta.label;
      document.getElementById('photoCaption').textContent = meta.caption;
      document.getElementById('searchedKeywordTag').textContent = '#' + meta.query.replace(/,/g, ' #');

      // 1. 단어 맞춤 고화질 사진 로드
      searchPhoto(currentQuery);

      // 2. 단어 맞춤 무료 음원 사이트 MP3 재생
      playTrack(meta.cat, meta.track);

      // 3. 비주얼 리액션
      popFloatingEmojis(meta.emoji);
    }

    function searchPhoto(query) {
      const spinner = document.getElementById('loadingSpinner');
      const photo = document.getElementById('moodPhoto');

      spinner.classList.remove('hidden');
      photo.classList.add('opacity-30');

      const randomSeed = Math.floor(Math.random() * 999999);
      const targetUrl = `https://picsum.photos/seed/${query}-${randomSeed}/900/675`;

      const img = new Image();
      img.src = targetUrl;
      img.onload = () => {
        photo.src = targetUrl;
        photo.classList.remove('opacity-30');
        spinner.classList.add('hidden');
      };
      img.onerror = () => {
        photo.src = `https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=900&auto=format&fit=crop&q=80`;
        photo.classList.remove('opacity-30');
        spinner.classList.add('hidden');
      };
    }

    function fetchAnotherPhoto() {
      searchPhoto(currentQuery);
    }

    function quick(str) {
      document.getElementById('moodInput').value = str;
      applyMood();
    }

    // 마이크 음성인식
    let isListening = false;
    let recognition = null;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new Speech();
      recognition.lang = 'ko-KR';
      recognition.onstart = () => {
        isListening = true;
        document.getElementById('micBtn').className = 'w-12 bg-rose-600 text-white border border-rose-500 rounded-2xl flex items-center justify-center animate-pulse';
      };
      recognition.onresult = (e) => {
        document.getElementById('moodInput').value = e.results[0][0].transcript;
        applyMood();
      };
      recognition.onend = () => {
        isListening = false;
        document.getElementById('micBtn').className = 'w-12 bg-slate-800 hover:bg-slate-700 text-rose-400 border border-slate-700 rounded-2xl flex items-center justify-center active:scale-95 transition shadow-sm';
      };
    }

    function toggleSpeech() {
      if (!recognition) {
        alert('이 브라우저는 음성 인식을 지원하지 않습니다. 텍스트로 적어주세요!');
        return;
      }
      if (isListening) recognition.stop();
      else recognition.start();
    }
  </script>
</body>
</html>
