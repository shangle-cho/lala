<!DOCTYPE html>
<html lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오늘 뭐 먹지? 룰렛 🍱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col items-center justify-between p-4 select-none pb-8">

  <!-- 헤더 영역 -->
  <header class="w-full max-w-sm text-center pt-3">
    <div class="inline-block bg-orange-200 text-orange-900 text-xs font-bold px-3 py-1 rounded-full mb-1">
      🍽️ 결정장애 완벽 해결
    </div>
    <h1 class="text-2xl font-black text-gray-900">오늘 뭐 먹지? 룰렛</h1>
    <p class="text-xs text-gray-500 mt-1">돌리기만 하면 오늘 한 끼 뚝딱 정해드려요!</p>
  </header>

  <!-- 룰렛 본체 영역 -->
  <main class="w-full max-w-sm flex flex-col items-center my-auto">
    <!-- 룰렛 캔버스 + 화살표 컨테이너 -->
    <div class="relative w-full aspect-square max-w-[320px] flex items-center justify-center p-2">
      <!-- 위쪽 고정 빨간 화살표 핀 -->
      <div class="absolute -top-1 left-1/2 -translate-x-1/2 z-20 flex flex-col items-center">
        <div class="w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-t-[24px] border-t-red-600 drop-shadow-md"></div>
        <div class="w-3 h-3 bg-red-700 rounded-full -mt-6"></div>
      </div>

      <!-- 룰렛 원판 캔버스 -->
      <canvas id="rouletteCanvas" class="w-full h-full drop-shadow-2xl rounded-full"></canvas>

      <!-- 중앙 장식 원판 -->
      <div class="absolute w-14 h-14 bg-white rounded-full shadow-lg border-4 border-amber-500 flex items-center justify-center z-10">
        <span class="text-xl">😋</span>
      </div>
    </div>

    <!-- 돌리기 메인 버튼 -->
    <button id="spinBtn" onclick="spinRoulette()" class="w-full mt-6 py-4 bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-600 hover:to-amber-700 text-white font-black text-lg rounded-2xl shadow-xl flex items-center justify-center gap-2 border border-orange-300 active:scale-95 transition">
      <i class="fa-solid fa-arrows-rotate text-xl"></i>
      <span>메뉴 룰렛 힘차게 돌리기!</span>
    </button>
  </main>

  <!-- 메뉴 편집 및 관리 영역 -->
  <section class="w-full max-w-sm bg-white p-4 rounded-2xl border border-amber-200 shadow-sm mt-3">
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-xs font-black text-gray-700">내가 담은 메뉴 (<span id="menuCount">0</span>개)</h2>
      <button onclick="resetDefaultMenu()" class="text-[11px] text-gray-400 hover:text-gray-600 underline">기본 메뉴로 리셋</button>
    </div>

    <!-- 입력창 -->
    <div class="flex gap-2 mb-2.5">
      <input id="newMenuInput" type="text" placeholder="새 메뉴 입력 (예: 돈까스)" maxlength="10" 
             class="flex-1 bg-amber-50/60 border border-amber-200 rounded-xl px-3 py-2 text-xs font-bold text-gray-800 outline-none focus:border-orange-500">
      <button onclick="addMenu()" class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-3 py-2 rounded-xl text-xs active:scale-95 transition">
        추가
      </button>
    </div>

    <!-- 메뉴 태그 리스트 -->
    <div id="tagContainer" class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto pr-1"></div>
  </section>

  <!-- 당첨 결과 모달 팝업 -->
  <div id="resultModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-6 text-center max-w-xs w-full shadow-2xl border-4 border-orange-400 animate-bounce-short">
      <div class="text-5xl mb-2">🎉</div>
      <p class="text-xs text-orange-600 font-extrabold uppercase tracking-wider">오늘의 당첨 메뉴</p>
      <h3 id="resultMenuText" class="text-3xl font-black text-gray-900 my-2">제육볶음</h3>
      <p class="text-xs text-gray-500 mb-5">고민 끝! 오늘은 이거 먹으러 가요!</p>

      <div class="flex flex-col gap-2">
        <a id="searchBtn" href="#" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md text-xs flex items-center justify-center gap-1.5 transition active:scale-95">
          <i class="fa-solid fa-map-location-dot"></i>
          <span>내 주변 식당 찾아보기</span>
        </a>
        <button onclick="closeModal()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl shadow-md text-xs transition active:scale-95">
          한 번 더 돌리기 🎲
        </button>
      </div>
    </div>
  </div>

  <script>
    // --- 소리 합성 엔진 (Web Audio) ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    // 룰렛 찰칵거리는 소리
    function playTick() {
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(450, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.05);
      } catch(e) {}
    }

    // 당첨 팡파르 멜로디
    function playWinFanfare() {
      try {
        const ctx = getAudioCtx();
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const start = ctx.currentTime + (idx * 0.1);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0, start);
          gain.gain.linearRampToValueAtTime(0.4, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.01, start + 0.28);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.3);
        });
      } catch(e) {}
    }

    // --- 기본 메뉴 데이터 및 색상 ---
    const defaultMenus = ['든든한 국밥', '제육볶음', '김치찌개', '짜장면/짬뽕', '바삭 돈까스', '삼겹살', '시원한 냉면', '초밥/회'];
    const sliceColors = [
      '#F87171', '#FB923C', '#FBBF24', '#34D399', 
      '#60A5FA', '#818CF8', '#A78BFA', '#F472B6'
    ];

    let menus = JSON.parse(localStorage.getItem('my_roulette_menus')) || [...defaultMenus];

    const canvas = document.getElementById('rouletteCanvas');
    const ctx = canvas.getContext('2d');
    let currentAngle = 0;
    let isSpinning = false;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      drawRoulette();
    }

    function drawRoulette() {
      const rect = canvas.getBoundingClientRect();
      const numSlices = menus.length;
      const arc = (2 * Math.PI) / numSlices;
      const radius = rect.width / 2;
      const cx = radius;
      const cy = radius;

      ctx.clearRect(0, 0, rect.width, rect.height);

      for (let i = 0; i < numSlices; i++) {
        const start = currentAngle + i * arc;
        const end = start + arc;

        // 부채꼴 채우기
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius - 4, start, end);
        ctx.fillStyle = sliceColors[i % sliceColors.length];
        ctx.fill();
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 3;
        ctx.stroke();

        // 텍스트 그리기
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(start + arc / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 13px Noto Sans KR';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 4;
        ctx.fillText(menus[i], radius - 20, 5);
        ctx.restore();
      }
    }

    // 룰렛 회전 물리 엔진
    function spinRoulette() {
      if (isSpinning) return;
      if (menus.length < 2) {
        alert('메뉴를 최소 2개 이상 등록해 주세요!');
        return;
      }

      isSpinning = true;
      document.getElementById('spinBtn').classList.add('opacity-50', 'pointer-events-none');

      const fullSpins = 5 + Math.floor(Math.random() * 4); // 5~8바퀴
      const extraAngle = Math.random() * Math.PI * 2;
      const totalRotation = fullSpins * Math.PI * 2 + extraAngle;
      
      const duration = 3800; // 3.8초 동안 회전
      const startTime = performance.now();
      const startAngle = currentAngle;
      let lastTickAngle = currentAngle;

      function animate(time) {
        const elapsed = time - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        // 팽팽 돌다 천천히 멈추는 감속 곡선 (easeOutCubic)
        const ease = 1 - Math.pow(1 - progress, 3);
        currentAngle = startAngle + totalRotation * ease;

        // 핀 통과할 때마다 소리
        const arc = (Math.PI * 2) / menus.length;
        if (Math.abs(currentAngle - lastTickAngle) >= arc) {
          playTick();
          lastTickAngle = currentAngle;
        }

        drawRoulette();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          document.getElementById('spinBtn').classList.remove('opacity-50', 'pointer-events-none');
          selectWinner();
        }
      }

      requestAnimationFrame(animate);
    }

    // 꼭대기(12시 방향, -Math.PI/2)에 걸린 메뉴 계산
    function selectWinner() {
      const arc = (Math.PI * 2) / menus.length;
      // 12시 방향 각도
      const topAngle = (3 * Math.PI) / 2;
      const normalized = (topAngle - (currentAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      const winningIndex = Math.floor(normalized / arc) % menus.length;
      const winningMenu = menus[winningIndex];

      playWinFanfare();
      showResult(winningMenu);
    }

    function showResult(menu) {
      document.getElementById('resultMenuText').textContent = menu;
      // 네이버 지도에서 주변 맛집 검색 링크 연결
      document.getElementById('searchBtn').href = 'https://m.map.naver.com/search2/search.naver?query=' + encodeURIComponent(menu);
      document.getElementById('resultModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('resultModal').classList.add('hidden');
    }

    // 메뉴 관리 로직
    function updateMenuTags() {
      const container = document.getElementById('tagContainer');
      container.innerHTML = '';
      menus.forEach((m, idx) => {
        const tag = document.createElement('div');
        tag.className = 'flex items-center gap-1.5 bg-amber-100/80 text-amber-900 border border-amber-300 text-xs font-bold px-2.5 py-1 rounded-xl shadow-xs';
        tag.innerHTML = `
          <span>${m}</span>
          <button onclick="removeMenu(${idx})" class="text-amber-500 hover:text-red-500 text-xs">✕</button>
        `;
        container.appendChild(tag);
      });
      document.getElementById('menuCount').textContent = menus.length;
      localStorage.setItem('my_roulette_menus', JSON.stringify(menus));
      drawRoulette();
    }

    function addMenu() {
      const input = document.getElementById('newMenuInput');
      const val = input.value.trim();
      if (!val) return;
      if (menus.includes(val)) {
        alert('이미 목록에 있는 메뉴예요!');
        return;
      }
      menus.push(val);
      input.value = '';
      updateMenuTags();
    }

    function removeMenu(idx) {
      if (menus.length <= 2) {
        alert('룰렛은 최소 2개 메뉴가 있어야 돌릴 수 있어요!');
        return;
      }
      menus.splice(idx, 1);
      updateMenuTags();
    }

    function resetDefaultMenu() {
      if (confirm('기본 메뉴 목록으로 다시 채울까요?')) {
        menus = [...defaultMenus];
        updateMenuTags();
      }
    }

    document.getElementById('newMenuInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addMenu();
    });

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', () => {
      resizeCanvas();
      updateMenuTags();
    });
    setTimeout(resizeCanvas, 100);
  </script>
</body>
</html>
