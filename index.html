<!DOCTYPE html>
<html lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>체위 룰렛 🎲</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="bg-slate-950 min-h-screen flex flex-col items-center justify-between p-4 select-none pb-8 text-white">

  <!-- 헤더 영역 -->
  <header class="w-full max-w-sm text-center pt-3">
    <div class="inline-block bg-rose-950/80 text-rose-300 text-xs font-bold px-3.5 py-1 rounded-full mb-1 border border-rose-800/60 shadow-sm">
      ✨ 몽환 사운드 & 포지션 가이드
    </div>
    <h1 class="text-2xl font-black text-rose-100">포지션 룰렛 🎲</h1>
    <p class="text-xs text-slate-400 mt-1">버튼을 돌려 오늘의 무드를 확인해보세요</p>
  </header>

  <!-- 룰렛 본체 영역 -->
  <main class="w-full max-w-sm flex flex-col items-center my-auto">
    <div class="relative w-full aspect-square max-w-[310px] flex items-center justify-center p-2">
      <!-- 상단 지침 화살표 -->
      <div class="absolute -top-1 left-1/2 -translate-x-1/2 z-20 flex flex-col items-center">
        <div class="w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-t-[24px] border-t-rose-500 drop-shadow-md"></div>
        <div class="w-3 h-3 bg-rose-600 rounded-full -mt-6"></div>
      </div>

      <!-- 룰렛 캔버스 -->
      <canvas id="rouletteCanvas" class="w-full h-full drop-shadow-2xl rounded-full"></canvas>

      <!-- 중앙 원판 -->
      <div class="absolute w-14 h-14 bg-slate-900 rounded-full shadow-lg border-4 border-rose-500 flex items-center justify-center z-10">
        <span class="text-xl">🎲</span>
      </div>
    </div>

    <!-- 실행 버튼 -->
    <button id="spinBtn" onclick="spinRoulette()" class="w-full mt-6 py-4 bg-gradient-to-r from-rose-600 via-pink-600 to-purple-600 hover:from-rose-500 hover:to-purple-500 text-white font-black text-base rounded-2xl shadow-xl flex items-center justify-center gap-2 border border-rose-400/30 active:scale-95 transition">
      <i class="fa-solid fa-arrows-rotate text-lg"></i>
      <span>룰렛 돌리기!</span>
    </button>
  </main>

  <!-- 8가지 항목 미리보기 뱃지 -->
  <section class="w-full max-w-sm bg-slate-900/80 p-3.5 rounded-2xl border border-slate-800 shadow-sm mt-3">
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-xs font-black text-slate-300">포함된 8가지 스타일</h2>
      <span class="text-[11px] text-rose-400 font-bold">터치하면 바로 확인</span>
    </div>
    <div class="grid grid-cols-4 gap-1.5" id="quickList"></div>
  </section>

  <!-- 당첨 결과 모달 (픽토그램 그림 + 설명) -->
  <div id="resultModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 rounded-3xl p-6 text-center max-w-xs w-full shadow-2xl border-2 border-rose-500/80 animate-in fade-in zoom-in duration-200">
      <span class="text-xs bg-rose-950 text-rose-300 px-3 py-1 rounded-full font-bold border border-rose-800">
        TODAY'S PICK
      </span>
      
      <!-- 자세 픽토그램 SVG 그래픽 영역 -->
      <div class="w-28 h-28 mx-auto my-3 rounded-2xl bg-slate-950 border border-slate-800 flex items-center justify-center shadow-inner p-2" id="resultSvgContainer">
        <!-- SVG 주입 -->
      </div>

      <h3 id="resultName" class="text-2xl font-black text-white mb-1">정상위</h3>
      <p id="resultDesc" class="text-xs text-rose-300/90 font-medium mb-3">서로 눈을 마주 보며 밀착하는 클래식 자세</p>
      
      <!-- 특징 태그 -->
      <div id="resultTags" class="flex justify-center gap-1.5 mb-5 text-[11px]"></div>

      <button onclick="closeModal()" class="w-full bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 text-white font-bold py-3.5 rounded-xl shadow-md text-xs transition active:scale-95">
        다시 돌리기 🎲
      </button>
    </div>
  </div>

  <script>
    // --- 무드 합성 오디오 엔진 (Web Audio) ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    // 1. 회전 시 심장박동 / 서스펜스 펄스 사운드 (두근... 두근...)
    function playHeartbeatPulse() {
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;

        // 서브 베이스 쿵 소리
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(95, now);
        osc.frequency.exponentialRampToValueAtTime(35, now + 0.09);

        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      } catch(e) {}
    }

    // 2. 당첨 시 로맨틱 & 몽환적인 벨/패드 멜로디
    function playSensualChime() {
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;

        // 신비롭고 몽환적인 화음 (Fm9 계열 아르페지오: F4, Ab4, C5, Eb5, G5)
        const chord = [349.23, 415.30, 523.25, 622.25, 783.99];

        chord.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const startTime = now + (idx * 0.08);

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);

          // 부드럽게 피어오르는 어택 & 긴 잔향(Decay)
          gain.gain.setValueAtTime(0.0001, startTime);
          gain.gain.linearRampToValueAtTime(0.25, startTime + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.85);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.9);
        });
      } catch(e) {}
    }

    // 8가지 자세 데이터 & 맞춤형 픽토그램 SVG
    const positions = [
      {
        name: '정상위',
        desc: '서로 얼굴을 마주 보며 밀착하는 클래식 자세',
        tags: ['#친밀감', '#교감', '#기본'],
        svg: `<svg viewBox="0 0 100 100" class="w-full h-full stroke-rose-400 fill-none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="25" cy="70" r="7" class="fill-rose-400 stroke-none"/>
          <line x1="25" y1="70" x2="80" y2="70" />
          <circle cx="32" cy="50" r="7" class="fill-rose-300 stroke-none"/>
          <line x1="32" y1="52" x2="80" y2="62" />
          <path d="M40,55 L35,70" stroke-width="4"/>
        </svg>`
      },
      {
        name: '후배위',
        desc: '뒤에서 포근하게 감싸 안는 깊은 결합 자세',
        tags: ['#깊은자극', '#스릴', '#체력'],
        svg: `<svg viewBox="0 0 100 100" class="w-full h-full stroke-pink-400 fill-none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="25" cy="45" r="7" class="fill-pink-400 stroke-none"/>
          <path d="M25,48 Q40,48 55,60 L55,75" />
          <circle cx="70" cy="35" r="7" class="fill-pink-300 stroke-none"/>
          <path d="M70,38 L65,60 L75,75" />
        </svg>`
      },
      {
        name: '여성상위',
        desc: '상대방 위에 앉아 속도와 깊이를 직접 조절하는 자세',
        tags: ['#리드', '#주도권', '#자극'],
        svg: `<svg viewBox="0 0 100 100" class="w-full h-full stroke-purple-400 fill-none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="20" cy="72" r="7" class="fill-purple-400 stroke-none"/>
          <line x1="20" y1="72" x2="80" y2="72" />
          <circle cx="50" cy="28" r="7" class="fill-purple-300 stroke-none"/>
          <line x1="50" y1="35" x2="50" y2="65" />
          <path d="M50,65 L35,72 M50,65 L65,72" stroke-width="5"/>
        </svg>`
      },
      {
        name: '측와위',
        desc: '옆으로 편안하게 누워 지치지 않고 즐기는 자세',
        tags: ['#편안함', '#오랜시간', '#릴랙스'],
        svg: `<svg viewBox="0 0 100 100" class="w-full h-full stroke-rose-400 fill-none" stroke-width="6" stroke-linecap="round">
          <circle cx="25" cy="45" r="7" class="fill-rose-400 stroke-none"/>
          <circle cx="25" cy="65" r="7" class="fill-rose-300 stroke-none"/>
          <line x1="30" y1="45" x2="85" y2="52" />
          <line x1="30" y1="65" x2="85" y2="58" />
        </svg>`
      },
      {
        name: '역기승위',
        desc: '뒤돌아 앉아 색다른 시각적 즐거움을 주는 자세',
        tags: ['#시각자극', '#특별함', '#조절'],
        svg: `<svg viewBox="0 0 100 100" class="w-full h-full stroke-fuchsia-400 fill-none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="80" cy="72" r="7" class="fill-fuchsia-400 stroke-none"/>
          <line x1="20" y1="72" x2="80" y2="72" />
          <circle cx="45" cy="30" r="7" class="fill-fuchsia-300 stroke-none"/>
          <path d="M45,35 L40,65 L55,72" />
        </svg>`
      },
      {
        name: '좌위',
        desc: '서로 끌어안고 앉아 가장 진한 포옹을 나누는 자세',
        tags: ['#밀착', '#포옹', '#로맨틱'],
        svg: `<svg viewBox="0 0 100 100" class="w-full h-full stroke-red-400 fill-none" stroke-width="6" stroke-linecap="round">
          <circle cx="38" cy="35" r="7" class="fill-red-400 stroke-none"/>
          <circle cx="62" cy="35" r="7" class="fill-red-300 stroke-none"/>
          <path d="M38,42 L42,75 L65,75" />
          <path d="M62,42 L58,75 L35,75" />
        </svg>`
      },
      {
        name: '입위',
        desc: '벽이나 가구를 짚고 선 채로 시도하는 활동적인 자세',
        tags: ['#스탠딩', '#정열', '#새로운장소'],
        svg: `<svg viewBox="0 0 100 100" class="w-full h-full stroke-amber-400 fill-none" stroke-width="6" stroke-linecap="round">
          <circle cx="45" cy="22" r="7" class="fill-amber-400 stroke-none"/>
          <line x1="45" y1="28" x2="42" y2="82" />
          <circle cx="60" cy="22" r="7" class="fill-amber-300 stroke-none"/>
          <line x1="60" y1="28" x2="56" y2="82" />
        </svg>`
      },
      {
        name: '스푼위',
        desc: '뒤에서 숟가락처럼 겹쳐 누워 체온을 느끼는 다정한 자세',
        tags: ['#다정함', '#포옹', '#아침'],
        svg: `<svg viewBox="0 0 100 100" class="w-full h-full stroke-indigo-400 fill-none" stroke-width="6" stroke-linecap="round">
          <circle cx="30" cy="45" r="6" class="fill-indigo-300 stroke-none"/>
          <circle cx="32" cy="58" r="6" class="fill-indigo-400 stroke-none"/>
          <path d="M30,48 Q55,46 80,48" />
          <path d="M32,61 Q57,59 82,61" />
        </svg>`
      }
    ];

    const sliceColors = [
      '#E11D48', '#BE185D', '#9D174D', '#831843', 
      '#4C0519', '#9F1239', '#C026D3', '#7C3AED'
    ];

    const canvas = document.getElementById('rouletteCanvas');
    const ctx = canvas.getContext('2d');
    let currentAngle = 0;
    let isSpinning = false;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      drawRoulette();
    }

    function drawRoulette() {
      const rect = canvas.getBoundingClientRect();
      const count = positions.length;
      const arc = (2 * Math.PI) / count;
      const radius = rect.width / 2;
      const cx = radius;
      const cy = radius;

      ctx.clearRect(0, 0, rect.width, rect.height);

      for (let i = 0; i < count; i++) {
        const start = currentAngle + i * arc;
        const end = start + arc;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius - 4, start, end);
        ctx.fillStyle = sliceColors[i % sliceColors.length];
        ctx.fill();
        ctx.strokeStyle = '#0F172A';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(start + arc / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 13px Noto Sans KR';
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 3;
        ctx.fillText(positions[i].name, radius - 18, 5);
        ctx.restore();
      }
    }

    function spinRoulette() {
      if (isSpinning) return;
      isSpinning = true;
      document.getElementById('spinBtn').classList.add('opacity-50', 'pointer-events-none');

      const fullSpins = 5 + Math.floor(Math.random() * 4);
      const extraAngle = Math.random() * Math.PI * 2;
      const totalRotation = fullSpins * Math.PI * 2 + extraAngle;

      const duration = 3600;
      const startTime = performance.now();
      const startAngle = currentAngle;
      let lastTickAngle = currentAngle;

      function animate(time) {
        const elapsed = time - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 3);
        currentAngle = startAngle + totalRotation * ease;

        const arc = (Math.PI * 2) / positions.length;
        if (Math.abs(currentAngle - lastTickAngle) >= arc) {
          playHeartbeatPulse();
          lastTickAngle = currentAngle;
        }

        drawRoulette();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          document.getElementById('spinBtn').classList.remove('opacity-50', 'pointer-events-none');
          selectWinner();
        }
      }

      requestAnimationFrame(animate);
    }

    function selectWinner() {
      const arc = (Math.PI * 2) / positions.length;
      const topAngle = (3 * Math.PI) / 2;
      const normalized = (topAngle - (currentAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      const winningIndex = Math.floor(normalized / arc) % positions.length;
      
      playSensualChime();
      showModal(positions[winningIndex]);
    }

    function showModal(item) {
      document.getElementById('resultName').textContent = item.name;
      document.getElementById('resultDesc').textContent = item.desc;
      document.getElementById('resultSvgContainer').innerHTML = item.svg;

      const tagsEl = document.getElementById('resultTags');
      tagsEl.innerHTML = '';
      item.tags.forEach(t => {
        const span = document.createElement('span');
        span.className = 'bg-slate-800 text-rose-300 px-2 py-0.5 rounded-md border border-slate-700 font-bold';
        span.textContent = t;
        tagsEl.appendChild(span);
      });

      document.getElementById('resultModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('resultModal').classList.add('hidden');
    }

    function renderQuickList() {
      const container = document.getElementById('quickList');
      container.innerHTML = '';
      positions.forEach((p) => {
        const btn = document.createElement('button');
        btn.className = 'bg-slate-800/80 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl p-2 text-xs font-bold active:scale-95 transition truncate text-center';
        btn.textContent = p.name;
        btn.onclick = () => {
          playSensualChime();
          showModal(p);
        };
        container.appendChild(btn);
      });
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', () => {
      resizeCanvas();
      renderQuickList();
    });
    setTimeout(resizeCanvas, 100);
  </script>
</body>
</html>
