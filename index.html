<!DOCTYPE html>
<html lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>체위 룰렛 🎲</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="bg-slate-950 min-h-screen flex flex-col items-center justify-between p-4 select-none pb-8 text-white">

  <!-- 상단 헤더 -->
  <header class="w-full max-w-sm text-center pt-2">
    <div class="inline-block bg-rose-950/80 text-rose-300 text-xs font-bold px-3.5 py-1 rounded-full mb-1 border border-rose-800/60 shadow-sm">
      ✨ 빅 픽토그램 그래픽 & 포지션 가이드
    </div>
    <h1 class="text-2xl font-black text-rose-100">포지션 룰렛 🎲</h1>
    <p class="text-xs text-slate-400 mt-1">버튼을 돌려 오늘의 자세를 확인해보세요</p>
  </header>

  <!-- 룰렛 본체 영역 -->
  <main class="w-full max-w-sm flex flex-col items-center my-auto">
    <div class="relative w-full aspect-square max-w-[290px] flex items-center justify-center p-2">
      <!-- 상단 지침 화살표 -->
      <div class="absolute -top-1 left-1/2 -translate-x-1/2 z-20 flex flex-col items-center">
        <div class="w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-t-[24px] border-t-rose-500 drop-shadow-md"></div>
        <div class="w-3 h-3 bg-rose-600 rounded-full -mt-6"></div>
      </div>

      <!-- 룰렛 캔버스 -->
      <canvas id="rouletteCanvas" class="w-full h-full drop-shadow-2xl rounded-full"></canvas>

      <!-- 중앙 원판 -->
      <div class="absolute w-14 h-14 bg-slate-900 rounded-full shadow-lg border-4 border-rose-500 flex items-center justify-center z-10">
        <span class="text-xl">🎲</span>
      </div>
    </div>

    <!-- 실행 버튼 -->
    <button id="spinBtn" onclick="spinRoulette()" class="w-full mt-5 py-4 bg-gradient-to-r from-rose-600 via-pink-600 to-purple-600 hover:from-rose-500 hover:to-purple-500 text-white font-black text-base rounded-2xl shadow-xl flex items-center justify-center gap-2 border border-rose-400/30 active:scale-95 transition">
      <i class="fa-solid fa-arrows-rotate text-lg"></i>
      <span>룰렛 돌리기!</span>
    </button>
  </main>

  <!-- 빠른 선택 뱃지 -->
  <section class="w-full max-w-sm bg-slate-900/80 p-3 rounded-2xl border border-slate-800 shadow-sm mt-2">
    <div class="flex items-center justify-between mb-2 px-1">
      <h2 class="text-xs font-black text-slate-300">8가지 포지션 바로보기</h2>
      <span class="text-[11px] text-rose-400 font-bold">터치하면 큰 그림 확인</span>
    </div>
    <div class="grid grid-cols-4 gap-1.5" id="quickList"></div>
  </section>

  <!-- 당첨 결과 모달 (그림 중심 대형 카드) -->
  <div id="resultModal" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden flex items-center justify-center p-3 z-50">
    <div class="bg-slate-900 rounded-3xl p-4 text-center max-w-sm w-full shadow-2xl border-2 border-rose-500/80 flex flex-col">
      
      <!-- 상단 타이틀 & 한 줄 요약 -->
      <div class="mb-2">
        <div class="flex items-center justify-center gap-2">
          <span class="text-[10px] bg-rose-950 text-rose-300 px-2.5 py-0.5 rounded-full font-bold border border-rose-800">PICK</span>
          <h3 id="resName" class="text-2xl font-black text-white">정상위</h3>
        </div>
        <p id="resSummary" class="text-xs text-rose-300 font-bold mt-1">눈을 마주치며 서로의 온도를 가장 깊게 느끼는 자세</p>
      </div>

      <!-- ★ 아주 큼직한 포스터 스타일 그래픽 영역 ★ -->
      <div class="relative w-full aspect-[4/3] bg-gradient-to-b from-slate-950 to-slate-900 rounded-2xl border border-slate-800 p-2 flex items-center justify-center shadow-inner overflow-hidden my-1">
        
        <!-- 대형 픽토그램 SVG -->
        <div id="resSvg" class="w-full h-full flex items-center justify-center"></div>

        <!-- 그림 위에 오버레이된 '손 위치' 태그 (상단 배치) -->
        <div class="absolute top-2.5 left-2.5 bg-black/75 backdrop-blur-sm border border-rose-500/60 px-2.5 py-1 rounded-lg text-left shadow-lg">
          <div class="text-[9px] text-rose-400 font-bold flex items-center gap-1">
            <span>🤲 두 손 위치</span>
          </div>
          <div id="resHandsOverlay" class="text-[11px] text-white font-black truncate max-w-[210px]">
            상대 뺨 감싸기 & 바닥 지탱
          </div>
        </div>

        <!-- 그림 위에 오버레이된 '대사' 말풍선 (하단 배치) -->
        <div class="absolute bottom-2.5 inset-x-2.5 bg-rose-950/90 backdrop-blur-md border border-rose-400/70 p-2 rounded-xl text-center shadow-xl">
          <div class="text-[9px] text-rose-300 font-extrabold flex items-center justify-center gap-1 mb-0.5">
            <i class="fa-solid fa-comment-dots text-[10px]"></i>
            <span>귓가 추천 대사</span>
          </div>
          <div id="resTalkOverlay" class="text-xs text-white font-black italic">
            "눈 마주쳐줘, 지금 너무 예뻐."
          </div>
        </div>
      </div>

      <!-- 리듬 박자 한 줄 알약 뱃지 -->
      <div class="my-2.5 py-1.5 px-3 bg-slate-950/80 rounded-xl border border-slate-800 flex items-center justify-between text-xs">
        <span class="text-slate-400 font-bold text-[11px]">⏱️ 추천 박자</span>
        <span id="resTempo" class="text-amber-300 font-black text-xs">느린 3박자 (깊게 1번 - 잔잔하게 2번)</span>
      </div>

      <!-- 닫기 버튼 -->
      <button onclick="closeModal()" class="w-full bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 text-white font-black py-3 rounded-xl shadow-md text-xs transition active:scale-95">
        닫기 / 다시 돌리기 🎲
      </button>
    </div>
  </div>

  <script>
    // 오디오 합성
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playPulse() {
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(95, now);
        osc.frequency.exponentialRampToValueAtTime(35, now + 0.08);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      } catch(e) {}
    }

    function playChime() {
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const chord = [349.23, 415.30, 523.25, 622.25, 783.99];
        chord.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const start = now + (idx * 0.07);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.001, start);
          gain.gain.linearRampToValueAtTime(0.2, start + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.8);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.85);
        });
      } catch(e) {}
    }

    // 8가지 데이터 (큰 그림 + 한줄요약 + 손위치 + 대사 + 박자)
    const positions = [
      {
        name: '정상위',
        summary: '서로 눈을 마주치며 깊은 온도를 나누는 클래식',
        hands: '상대 뺨 감싸기 & 바닥 지탱',
        talk: '"눈 마주쳐줘, 지금 너무 예뻐."',
        tempo: '느린 3박자 (깊게 1번 - 잔잔하게 2번)',
        svg: `<svg viewBox="0 0 140 100" class="w-full h-full stroke-rose-400 fill-none" stroke-width="7" stroke-linecap="round"><circle cx="35" cy="72" r="9" class="fill-rose-400 stroke-none"/><line x1="35" y1="72" x2="115" y2="72"/><circle cx="45" cy="46" r="9" class="fill-rose-300 stroke-none"/><line x1="45" y1="48" x2="115" y2="62"/><path d="M55,52 L50,72" stroke-width="5"/></svg>`
      },
      {
        name: '후배위',
        summary: '뒤에서 감싸 안으며 강한 몰입감을 주는 자세',
        hands: '골반 양옆 고정 & 베개/헤드 잡기',
        talk: '"너 느끼는 소리 들으니까 미칠 것 같아."',
        tempo: '규칙적 2박자 (4번 진입 후 1번 멈춤)',
        svg: `<svg viewBox="0 0 140 100" class="w-full h-full stroke-pink-400 fill-none" stroke-width="7" stroke-linecap="round"><circle cx="35" cy="40" r="9" class="fill-pink-400 stroke-none"/><path d="M35,45 Q55,45 75,60 L75,80"/><circle cx="95" cy="30" r="9" class="fill-pink-300 stroke-none"/><path d="M95,35 L88,60 L102,80"/></svg>`
      },
      {
        name: '여성상위',
        summary: '위에 앉아 원하는 속도와 깊이를 직접 이끄는 자세',
        hands: '상대 가슴 짚기 & 허벅지 받치기',
        talk: '"네가 원하는 속도대로 천천히 해봐."',
        tempo: '둥근 왈츠 3박자 (원 그리듯 굴리기)',
        svg: `<svg viewBox="0 0 140 100" class="w-full h-full stroke-purple-400 fill-none" stroke-width="7" stroke-linecap="round"><circle cx="30" cy="75" r="9" class="fill-purple-400 stroke-none"/><line x1="30" y1="75" x2="110" y2="75"/><circle cx="70" cy="24" r="9" class="fill-purple-300 stroke-none"/><line x1="70" y1="32" x2="70" y2="65"/><path d="M70,65 L50,75 M70,65 L90,75" stroke-width="6"/></svg>`
      },
      {
        name: '측와위',
        summary: '옆으로 편안하게 누워 지치지 않고 오래 교감하는 자세',
        hands: '목 뒤 팔베개 & 위쪽 다리 살짝 잡기',
        talk: '"이렇게 안고 있으니까 너무 편안해."',
        tempo: '호흡 맞춤 4초 1주기 (나른하게)',
        svg: `<svg viewBox="0 0 140 100" class="w-full h-full stroke-rose-400 fill-none" stroke-width="7" stroke-linecap="round"><circle cx="35" cy="40" r="9" class="fill-rose-400 stroke-none"/><circle cx="35" cy="65" r="9" class="fill-rose-300 stroke-none"/><line x1="42" y1="40" x2="120" y2="48"/><line x1="42" y1="65" x2="120" y2="58"/></svg>`
      },
      {
        name: '역기승위',
        summary: '뒤돌아 앉아 색다른 시각적 즐거움과 자극을 주는 자세',
        hands: '상대 발목 지탱 & 허리 아래 받치기',
        talk: '"뒤태가 너무 자극적이라 숨차."',
        tempo: '조심스러운 2초 1박 (깊게 앉고 멈춤)',
        svg: `<svg viewBox="0 0 140 100" class="w-full h-full stroke-fuchsia-400 fill-none" stroke-width="7" stroke-linecap="round"><circle cx="110" cy="75" r="9" class="fill-fuchsia-400 stroke-none"/><line x1="30" y1="75" x2="110" y2="75"/><circle cx="65" cy="26" r="9" class="fill-fuchsia-300 stroke-none"/><path d="M65,32 L58,65 L78,75"/></svg>`
      },
      {
        name: '좌위',
        summary: '서로 가슴을 맞대고 꼭 끌어안는 가장 로맨틱한 자세',
        hands: '목 뒤 감싸 안기 & 등 뒤 꽉 밀착하기',
        talk: '"너 숨소리 귀에 바로 들려서 더 좋아."',
        tempo: '숨소리 맞춘 밀착형 (앞뒤 3초 조임)',
        svg: `<svg viewBox="0 0 140 100" class="w-full h-full stroke-red-400 fill-none" stroke-width="7" stroke-linecap="round"><circle cx="50" cy="30" r="9" class="fill-red-400 stroke-none"/><circle cx="85" cy="30" r="9" class="fill-red-300 stroke-none"/><path d="M50,38 L55,75 L85,75"/><path d="M85,38 L80,75 L48,75"/></svg>`
      },
      {
        name: '입위',
        summary: '선 채로 서로를 꽉 지탱하는 활동적이고 정열적인 자세',
        hands: '허벅지 단단히 들기 & 상대 목 꽉 감기',
        talk: '"나 꽉 안아, 떨어지지 않게."',
        tempo: '빠른 1초 1회 (짧고 강하게 집중)',
        svg: `<svg viewBox="0 0 140 100" class="w-full h-full stroke-amber-400 fill-none" stroke-width="7" stroke-linecap="round"><circle cx="58" cy="20" r="9" class="fill-amber-400 stroke-none"/><line x1="58" y1="28" x2="54" y2="85"/><circle cx="78" cy="20" r="9" class="fill-amber-300 stroke-none"/><line x1="78" y1="28" x2="72" y2="85"/></svg>`
      },
      {
        name: '스푼위',
        summary: '숟가락처럼 겹쳐 누워 아침처럼 다정하게 파고드는 자세',
        hands: '가슴 포근히 안기 & 깍지 껴 잡기',
        talk: '"온도 느껴져? 꼭 붙어있자."',
        tempo: '파도 밀물 썰물 (부드럽게 4초 주기)',
        svg: `<svg viewBox="0 0 140 100" class="w-full h-full stroke-indigo-400 fill-none" stroke-width="7" stroke-linecap="round"><circle cx="40" cy="40" r="8" class="fill-indigo-300 stroke-none"/><circle cx="42" cy="58" r="8" class="fill-indigo-400 stroke-none"/><path d="M40,44 Q70,42 105,44"/><path d="M42,62 Q72,60 107,62"/></svg>`
      }
    ];

    const sliceColors = ['#E11D48', '#BE185D', '#9D174D', '#831843', '#4C0519', '#9F1239', '#C026D3', '#7C3AED'];
    const canvas = document.getElementById('rouletteCanvas');
    const ctx = canvas.getContext('2d');
    let currentAngle = 0;
    let isSpinning = false;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      drawRoulette();
    }

    function drawRoulette() {
      const rect = canvas.getBoundingClientRect();
      const count = positions.length;
      const arc = (2 * Math.PI) / count;
      const radius = rect.width / 2;
      const cx = radius;
      const cy = radius;

      ctx.clearRect(0, 0, rect.width, rect.height);

      for (let i = 0; i < count; i++) {
        const start = currentAngle + i * arc;
        const end = start + arc;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius - 4, start, end);
        ctx.fillStyle = sliceColors[i % sliceColors.length];
        ctx.fill();
        ctx.strokeStyle = '#0F172A';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(start + arc / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 13px Noto Sans KR';
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 3;
        ctx.fillText(positions[i].name, radius - 18, 5);
        ctx.restore();
      }
    }

    function spinRoulette() {
      if (isSpinning) return;
      isSpinning = true;
      document.getElementById('spinBtn').classList.add('opacity-50', 'pointer-events-none');

      const fullSpins = 5 + Math.floor(Math.random() * 4);
      const extraAngle = Math.random() * Math.PI * 2;
      const totalRotation = fullSpins * Math.PI * 2 + extraAngle;

      const duration = 3500;
      const startTime = performance.now();
      const startAngle = currentAngle;
      let lastTickAngle = currentAngle;

      function animate(time) {
        const elapsed = time - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 3);
        currentAngle = startAngle + totalRotation * ease;

        const arc = (Math.PI * 2) / positions.length;
        if (Math.abs(currentAngle - lastTickAngle) >= arc) {
          playPulse();
          lastTickAngle = currentAngle;
        }

        drawRoulette();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          document.getElementById('spinBtn').classList.remove('opacity-50', 'pointer-events-none');
          selectWinner();
        }
      }

      requestAnimationFrame(animate);
    }

    function selectWinner() {
      const arc = (Math.PI * 2) / positions.length;
      const topAngle = (3 * Math.PI) / 2;
      const normalized = (topAngle - (currentAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      const winningIndex = Math.floor(normalized / arc) % positions.length;
      
      playChime();
      showModal(positions[winningIndex]);
    }

    function showModal(item) {
      document.getElementById('resName').textContent = item.name;
      document.getElementById('resSummary').textContent = item.summary;
      document.getElementById('resSvg').innerHTML = item.svg;
      document.getElementById('resHandsOverlay').textContent = item.hands;
      document.getElementById('resTalkOverlay').textContent = item.talk;
      document.getElementById('resTempo').textContent = item.tempo;
      document.getElementById('resultModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('resultModal').classList.add('hidden');
    }

    function renderQuickList() {
      const container = document.getElementById('quickList');
      container.innerHTML = '';
      positions.forEach((p) => {
        const btn = document.createElement('button');
        btn.className = 'bg-slate-800/80 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl p-2 text-xs font-bold active:scale-95 transition truncate text-center';
        btn.textContent = p.name;
        btn.onclick = () => {
          playChime();
          showModal(p);
        };
        container.appendChild(btn);
      });
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', () => {
      resizeCanvas();
      renderQuickList();
    });
    setTimeout(resizeCanvas, 100);
  </script>
</body>
</html>
